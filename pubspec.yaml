name: randil_grocery_pos
description: A modern Point of Sale system for Randil Grocery Shop built with Flutter for Windows Desktop.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Charts for Reports
  fl_chart: ^0.65.0

  # NOTE: google_fonts has been removed. Inter is bundled as an asset (see the
  # `fonts:` block below) so LAN / offline terminals need no runtime download.

  # Date & Time
  intl: ^0.19.0
  
  # Data Serialization
  json_annotation: ^4.8.1

  # Security / Password Hashing
  crypto: ^3.0.3

  # Windows Native APIs (printing, secure storage)
  win32: ^5.4.0
  ffi: ^2.1.0
  
  # Local Database
  path: ^1.8.3
  path_provider: ^2.1.0
  
  # State Management
  provider: ^6.0.0
  
  # File & Image Handling
  file_picker: ^6.0.0

  # Image processing (receipt logo raster for ESC/POS)
  image: ^4.2.0
  
  # Utils
  shared_preferences: ^2.2.2
  sqflite: ^2.2.8+4
  sqflite_common_ffi: ^2.4.0+2
  uuid: ^4.0.0
  window_manager: ^0.4.3
  desktop_multi_window: ^0.3.0
  
  # Google Drive Backup
  googleapis: ^12.0.0
  googleapis_auth: ^1.4.0
  
  # HTTP Client
  http: ^1.1.0
  
  # Local Storage & Sync
  dio: ^5.3.0
  
  # LAN server (admin PC hosts the live DB + API)
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_cors_headers: ^0.1.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  image_path: assets/images/randil_logo.png
  windows:
    generate: true
    image_path: assets/images/randil_logo.png

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/

  # Typography — Inter bundled as an asset so LAN / offline terminals render
  # exactly the same as the online dev machine (no runtime font download).
  # All four weights carry the OpenType `tnum` feature for tabular figures.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
