name: Build Randil Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "randil_mobile/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The local Windows laptop's Android tools crash (0xC00000FD), so the
      # APK is built here on GitHub's Linux runners where everything works.
      - name: Set up Flutter (matching local 3.44.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Flutter pub get
        working-directory: randil_mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: randil_mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: randil-mobile-apk
          path: randil_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error