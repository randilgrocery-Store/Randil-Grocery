org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# MACHINE WORKAROUND (this laptop only): enables the CMake-seed + no-strip
# workarounds in android/app/build.gradle.kts for the Windows-26200 / Google
# LLVM-tools crash. Normal machines and CI leave it unset ("false" works too).
randil.machineWorkaround=true
# MACHINE WORKAROUND: interrupted builds corrupt Kotlin's incremental caches;
# compile in-process (Gradle's JVM) without incremental mode for reliability.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
